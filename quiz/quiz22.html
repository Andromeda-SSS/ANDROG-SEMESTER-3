    <form action="#" method="post">

          <td>Nama Pelanggan</td>

            <td>Metode Pembayaran</td>

            <td>
                <input type="radio" id="transfer" name="tipe_pembayaran" value="transfer" checked>
                <label for="transfer">Transfer</label>
                <input type="radio" id="ewalet" name="tipe_pembayaran" value="ewalet">
                <label for="ewalet">E-Wallet</label>
            </td>
        </tr>

      </table>
      <button type="submit">Kirim Form</button>
    </form>
